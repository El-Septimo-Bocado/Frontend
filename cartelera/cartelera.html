<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cartelera</title>
  <link rel="stylesheet" href="cartelera.css"/>
</head>
<body>
  <!-- Barra de Navegación -->
  <header class="navbar">
    <a href="../principal/index.html" class="logo">
      <img src="../iconos/logo.png" alt="El Séptimo Bocado" style="height:70px;">
    </a>
    <nav>
      <ul>
        <li><a href="../principal/index.html">Inicio</a></li>
        <li><a href="../cartelera/cartelera.html">Cartelera</a></li>
        <li><a href="../menu/menu.html">Menu</a></li>
        <li><a href="../eventos/eventos.html">Eventos</a></li>
        <li><a href="../contacto/contacto.html">Contacto</a></li>
        <li><a href="../auth/login.html">Inicia Sesion</a></li>
      </ul>
    </nav>
  </header>

  <!-- Cartelera -->
  <main class="main-cartelera">
    <section class="cartelera">
      <h2>En cartelera y próximos estrenos</h2>

      <div id="cartelera-grid" class="peliculas">
        <!-- Aquí se inyectan las tarjetas -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 El Séptimo Bocado. Todos los derechos reservados.</p>
  </footer>

  <!-- Script: cargar películas desde el backend -->
  <script>
    (function () {
      const API = "http://localhost:8080/api/movies";

      // Normaliza el objeto película desde el backend
      const mapMovie = (m) => {
        const estado = (m.estado || "").toUpperCase(); // ACTIVA / PROXIMAMENTE / INACTIVA / ""
        return {
          id: m.id,
          titulo: m.titulo || m.title || "Película",
          // prioridad: caratula → poster → vacío
          imagen: m.caratula || m.poster || "",
          poster: m.poster || "",
          fondo: m.fondo || "",
          director: m.director || "",
          generos: m.generos || "",
          duracion: m.duracion || "",
          rating: (typeof m.rating === "number")
                    ? m.rating
                    : (m.rating ? parseFloat(m.rating) : null),
          estado,
          activo: m.activo !== false // true si no está borrada
        };
      };

      // Rating 0..5 → estrellitas
      function toFive(r) {
        if (typeof r !== "number" || Number.isNaN(r)) return null;
        return Math.max(0, Math.min(5, r));
      }

      function stars(rVal) {
        const r = toFive(rVal);
        if (r == null) return "—";
        const full  = Math.floor(r);
        const half  = (r - full) >= 0.5 ? 1 : 0;
        const empty = 5 - full - half;
        return "★".repeat(full) + (half ? "☆" : "") + "☆".repeat(empty);
      }

      // Tarjeta igual al index, con badge azul si es PROXIMAMENTE
      function cardHTML(movie) {
        const alt = movie.titulo.replace(/"/g, "&quot;");

        const img = movie.imagen
          ? `<img src="${movie.imagen}" alt="${alt}">`
          : `<div class="placeholder-poster">Sin imagen</div>`;

        const badge = (movie.estado === "PROXIMAMENTE")
          ? `<span class="badge-proximamente">Próximamente</span>`
          : "";

        return `
          <div class="card">
            ${badge}
            ${img}
            <h3>${movie.titulo}</h3>
            <p>${stars(movie.rating)}</p>
            <a href="../detalles/detalles.html?id=${movie.id}">
              <button>Ver Detalles</button>
            </a>
          </div>
        `;
      }

      function render(list) {
        const grid = document.getElementById("cartelera-grid");
        if (!grid) return;

        if (!list.length) {
          grid.innerHTML = `<p style="opacity:.7; text-align:center; grid-column:1 / -1;">No hay películas para mostrar.</p>`;
          return;
        }
        grid.innerHTML = list.map(cardHTML).join("");
      }

      fetch(API, { method: "GET" })
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(data => {
          const movies = Array.isArray(data) ? data.map(mapMovie) : [];

          // Solo mostramos pelis no borradas y con estado ACTIVA o PROXIMAMENTE
          const visibles = movies.filter(m =>
            m.activo && (m.estado === "ACTIVA" || m.estado === "PROXIMAMENTE")
          );

          // Opcional: primero ACTIVA (en cartelera), luego PROXIMAMENTE
          const ordenadas = [
            ...visibles.filter(m => m.estado === "ACTIVA"),
            ...visibles.filter(m => m.estado === "PROXIMAMENTE")
          ];

          render(ordenadas);
        })
        .catch(err => {
          console.error("[cartelera] error cargando /api/movies:", err);
          const grid = document.getElementById("cartelera-grid");
          if (grid) {
            grid.innerHTML = `
              <p style="color:#b00020; text-align:center; grid-column:1 / -1;">
                No pude cargar la cartelera desde ${API}
              </p>
              <p style="opacity:.7; text-align:center; grid-column:1 / -1;">
                Verifica que el backend está corriendo.
              </p>
            `;
          }
        });
    })();
  </script>

  <script src="../auth/auth.js"></script>
  <script src="../auth/navbar-session.js"></script>
</body>
</html>
