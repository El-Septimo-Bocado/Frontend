<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalles</title>
  <link rel="stylesheet" href="estreno.css" />
</head>
<body>
  <!-- Barra de Navegación -->
  <header class="navbar">
    <a href="../principal/index.html" class="logo">
      <img src="../iconos/logo.png" alt="El Séptimo Bocado" style="height:70px;">
    </a>
    <nav>
      <ul>
        <li><a href="../principal/index.html">Inicio</a></li>
        <li><a href="../cartelera/cartelera.html">Cartelera</a></li>
        <li><a href="../menu/menu.html">Menu</a></li>
        <li><a href="../eventos/eventos.html">Eventos</a></li>
        <li><a href="../auth/login.html">Inicia Sesión</a></li>
        <li><a href="../contacto/contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Detalles de la Película -->
  <main id="detalle-root" class="detalle-pelicula" style="--fondo-pelicula: url('../fondos/placeholder.jpg');">
    <div class="poster">
      <img id="poster-img" src="" alt="Poster" />
    </div>

    <div class="info">
      <h1 id="titulo">Cargando…</h1>
      <p id="genero" class="genero"></p>
      <p id="rating" class="rating"></p>
      <p id="sinopsis" class="sinopsis"></p>

      <div class="detalles">
        <p><strong>Director:</strong> <span id="director">—</span></p>
        <p><strong>Duración:</strong> <span id="duracion">—</span></p>
        <p><strong>Estado:</strong> <span id="estado">—</span></p>
      </div>

      <!-- Botón reservar (sin href para no romper el flujo) -->
      <a id="btn-reservar" class="btn-reservar" href="#">
        🎟️ Reservar Boletos
      </a>
    </div>
  </main>

  <!-- Horarios -->
  <section class="horarios">
    <h2>Horarios Disponibles</h2>
    <div id="horarios-grid" class="horarios-grid"></div>
  </section>

  <!-- Trailer (opcional) -->
  <section id="trailer-wrap" style="display:none; margin-top:20px;">
    <iframe id="trailer-iframe" width="100%" height="400" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </section>

  <!-- Reseñas (demo) -->
  <section class="reseñas">
    <h2>Reseñas de Usuarios</h2>
    <div class="reseña"><p><strong>Mago:</strong> ⭐⭐⭐⭐⭐ “Buenísima.”</p></div>
  </section>

  <footer>
    <p>&copy; 2025 El Séptimo Bocado. Todos los derechos reservados.</p>
  </footer>

  <!-- IMPORTANTE: primero auth y luego el js de detalles -->
  <script src="../auth/auth.js"></script>
  <script src="detalles.js"></script>
</body>
</html>
